<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨กำลังใจจาก KITO MOS✨</title>
    <style>
        /* 1. อัปเกรด Body ให้มี Animated Gradient */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(-45deg, #f3e5f5, #e1bee7, #fce4ec, #ede7f6);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Keyframes สำหรับเปลี่ยนสีพื้นหลังไปมา */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. ลูกเล่นฟองอากาศลอยดุ๊กดิ๊ก (Floating Bubbles) */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* ให้อยู่หลังสุด */
            overflow: hidden;
            pointer-events: none; /* ไม่ให้กวนการคลิกปุ่ม */
        }
        .bubbles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(112, 48, 160, 0.15); /* สีม่วงอ่อนๆ โปร่งแสง */
            animation: floatUp 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }
        /* แรนดอมขนาดและความเร็วให้ฟองอากาศแต่ละลูก */
        .bubbles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .bubbles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .bubbles li:nth-child(3) { left: 70%; width: 40px; height: 40px; animation-delay: 4s; }
        .bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .bubbles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .bubbles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .bubbles li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .bubbles li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .bubbles li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .bubbles li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(360deg); opacity: 0; }
        }

        /* 3. กล่อง Card ด้านหน้า (ปรับให้ลอยเด่นขึ้นมาจากพื้นหลัง) */
        .card {
            background: rgba(255, 255, 255, 0.95); /* เพิ่มความโปร่งแสงนิดๆ สไตล์ Glassmorphism */
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(112, 48, 160, 0.2);
            text-align: center;
            max-width: 350px;
            width: 90%; 
            border: 3px solid rgba(112, 48, 160, 0.8); 
            position: relative;
            z-index: 1; /* ให้อยู่หน้าฟองอากาศ */
        }
        
        h2 {
            color: #7030A0;
            margin-top: 0;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(112, 48, 160, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(112, 48, 160, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(112, 48, 160, 0); }
        }

        button {
            background: linear-gradient(135deg, #9b59b6, #7030A0);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(112, 48, 160, 0.4);
            animation: pulse 2s infinite; 
        }
        button:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 8px 20px rgba(112, 48, 160, 0.6);
            animation: none; 
        }
        button:active {
            transform: scale(0.95);
        }
        
        #loadingContainer {
            display: none;
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        #loadingBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B, #9b59b6, #7030A0);
            border-radius: 10px;
            transition: width 2s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        #gifContainer {
            display: none; 
            margin-top: 20px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.3) rotate(-5deg); }
            50% { transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        #gifContainer img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #7030A0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .message {
            color: #7030A0;
            font-weight: bold;
            margin-top: 18px;
            font-size: 16px;
            line-height: 1.6;
        }
        .highlight {
            color: #FF3333; 
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Container สำหรับลูกเล่นพื้นหลังฟองอากาศ -->
    <ul class="bubbles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="card">
        <h2>✨กำลังใจจาก KITO MOS✨</h2>
        <div class="subtitle" id="subtitleText">ตรวจพบคุณพยาบาลกำลังปั่นหนังสือสอบ! 📚</div>
        
        <button id="loveBtn" onclick="sendLove()">✨✨ รับไอเทมบัฟก่อนสอบ ✨✨</button>
        
        <div id="loadingContainer">
            <div id="loadingBar"></div>
        </div>

        <div id="gifContainer">
            <!-- อย่าลืมใส่ไฟล์แพนด้าแดงของมึงไว้ตรงนี้นะ! -->
            <img src="red_panda_cheer.gif" alt="Red Panda Cheer">
            <div class="message">
                ✨ เติมพลังให้คนเก่ง ✨<br>
                <span class="highlight">ขอให้อ่านตรงไหนก็เข้าหัว สอบกี่วิชาก็ All A ไปเลยนะ! ✌️✨</span><br>
                พักสายตาบ้างนะ สู้ๆ คับ! 🐼💕
            </div>
        </div>
    </div>

    <script>
        function sendLove() {
            document.getElementById("loveBtn").style.display = "none";
            let subtitle = document.getElementById("subtitleText");
            subtitle.innerHTML = "กำลังส่งไอเทมบัฟข้ามจังหวัด... ⏳<br>Please Wait...";
            subtitle.style.color = "#FF6B6B";
            subtitle.style.fontWeight = "bold";
            
            let loadingContainer = document.getElementById("loadingContainer");
            let loadingBar = document.getElementById("loadingBar");
            loadingContainer.style.display = "block";
            
            setTimeout(() => {
                loadingBar.style.width = "100%";
            }, 100);

            setTimeout(() => {
                loadingContainer.style.display = "none";
                subtitle.style.display = "none";
                document.getElementById("gifContainer").style.display = "block";
            }, 2200); 
        }
    </script>

</body>
</html>
