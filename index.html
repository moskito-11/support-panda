<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch Time Reminder 🍱✨</title>
    <style>
        body {
            background-color: #f3e5f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(112, 48, 160, 0.15); 
            text-align: center;
            max-width: 350px;
            border: 3px solid #7030A0; 
        }
        h2 {
            color: #7030A0; 
            margin-top: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(135deg, #9b59b6, #7030A0); 
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(112, 48, 160, 0.4);
        }
        button:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 8px 20px rgba(112, 48, 160, 0.6);
        }
        button:active {
            transform: scale(0.95);
        }
        
        #gifContainer {
            display: none; 
            margin-top: 20px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.3) rotate(-5deg); }
            50% { transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        #gifContainer img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #7030A0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .message {
            color: #7030A0;
            font-weight: bold;
            margin-top: 18px;
            font-size: 16px;
            line-height: 1.6;
        }
        .highlight {
            color: #FF3333; 
            font-size: 18px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🍱 Time for Lunch! 🍱</h2>
        <div class="subtitle" id="subtitleText">มีข้อความห่วงใยส่งตรงมาจากเด็กชายมอส!</div>
        
        <button id="loveBtn" onclick="sendLove()">✨ กดเปิดอ่านข้อความ 🍲 ✨</button>
        
        <div id="gifContainer">
            <img src="Heart Wow GIF.gif" alt="Sanrio Squad Excel Art">
            <div class="message">
                เที่ยงแล้วอย่าลืมหาอะไรกินน้าคุณพยาบาล 🍜<br>
                พักเบรกเติมพลังด้วยนะครับ!<br>
                <span class="highlight">😋 กินเยอะๆ จะได้มีแรง 😋</span>
            </div>
        </div>
    </div>

    <script>
        function sendLove() {
            document.getElementById("gifContainer").style.display = "block";
            document.getElementById("loveBtn").style.display = "none";
            document.getElementById("subtitleText").style.display = "none";
        }
    </script>

</body>
</html>
