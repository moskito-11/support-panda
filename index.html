<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐼 Midnight Support System 🌙</title>
    <style>
        body {
            /* พื้นหลังไล่สีพาสเทล ฟ้า-ชมพู อบอุ่นสุดๆ */
            background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 100%); 
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(244, 114, 182, 0.2);
            text-align: center;
            max-width: 320px;
            border: 4px solid #f9a8d4; /* ขอบสีชมพูพาสเทลน่ารักๆ */
            position: relative;
        }
        h2 {
            color: #db2777; /* สีชมพูเข้ม */
            margin-top: 0;
            font-size: 22px;
        }
        button {
            background: linear-gradient(45deg, #38bdf8, #f472b6); /* ปุ่มไล่สี ฟ้า-ชมพู */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(244, 114, 182, 0.4);
            animation: bounce 2s infinite; /* แอนิเมชันเด้งดึ๋งน่ารักๆ */
        }
        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 20px rgba(244, 114, 182, 0.6);
        }
        
        /* Animation เด้งดึ๋งๆ */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }

        #alertContainer {
            display: none; 
            margin-top: 15px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* เด้งป๊อปอัปแบบเยลลี่ */
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        #alertContainer img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 3px solid #fdf2f8;
        }
        .message {
            color: #db2777;
            font-weight: bold;
            font-size: 20px;
            line-height: 1.4;
        }
        .sub-message {
            color: #475569;
            font-size: 15px;
            margin-top: 10px;
            line-height: 1.6;
        }
        /* กล่องสถานะซัพพอร์ต */
        .status-box {
            background-color: #fdf2f8;
            color: #be185d;
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            border: 2px dashed #fbcfe8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="headerText">🌙 โหมดอยู่เป็นเพื่อนยันเช้า 🌙</h2>
        <br>
        <button id="scanBtn" onclick="triggerAlert()">รับพลังงานรอบดึก ✨</button>
        
        <div id="alertContainer">
            <img src="Red Panda Education GIF by Khan Academy Kids.gif" alt="Cute Panda GIF"> 
            <div class="message">💖 LATE NIGHT BOOST 💖</div>
            <div class="sub-message">
                ถึงคุณพยาบาลที่กำลังสู้ชีวิต: <br>
                เก่งมากๆ แล้วน้า แต่อย่าลืมพักสายตาจิบน้ำบ้างนะคับ<br>
                ระบบทางนี้จะสแตนด์บายเป็นเพื่อนเสมอ ไม่หนีไปนอนก่อนแน่นอน ✌️
            </div>
            
            <div class="status-box">
                ✔️ STATUS: 100% Awake for You <br>(ถ้าง่วงให้กินกาแฟ แต่ถ้าอยากได้คนเทกแคร์ให้ทักมานะคับ 🐼☕)
            </div>
        </div>
    </div>

    <script>
        function triggerAlert() {
            document.getElementById("alertContainer").style.display = "block";
            document.getElementById("scanBtn").style.display = "none";
            // เปลี่ยน Header ให้ดูซัพพอร์ตสุดๆ หลังจากกด
            document.querySelector("#headerText").innerText = "✨ สู้เค้านะคนเก่ง ✨";
        }
    </script>

</body>
</html>
