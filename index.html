<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>🔥 System Override 🔥</title>
    <style>
        body {
            background-color: #111827; /* สีดำเข้มขรึม */
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }
        .card {
            background: #1f2937; /* สีเทาเข้ม */
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(225, 29, 72, 0.4); /* เงาสีแดงเข้ม */
            text-align: center;
            max-width: 320px;
            border: 4px solid #e11d48; /* ขอบสีแดงนักสู้ */
        }
        h2 {
            color: #f43f5e; /* สีแดงสว่าง */
            margin-top: 0;
            font-size: 24px;
        }
        button {
            background-color: #e11d48; /* ปุ่มสีแดง */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.5);
            animation: pulse 1.5s infinite; /* แอนิเมชันจังหวะหัวใจ */
        }
        button:hover {
            transform: scale(1.05);
            background-color: #be123c;
        }
        
        /* Animation หัวใจเต้น */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }

        #alertContainer {
            display: none; 
            margin-top: 15px;
            animation: slideUp 0.6s ease-out; /* เด้งขึ้นมาแบบหนักแน่น */
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        #alertContainer img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid #374151;
        }
        .message {
            color: #f43f5e;
            font-weight: bold;
            font-size: 22px;
            line-height: 1.4;
        }
        .sub-message {
            color: #e5e7eb; /* สีตัวอักษรสว่างบนพื้นมืด */
            font-size: 16px;
            margin-top: 10px;
            line-height: 1.6;
        }
        /* กล่องสถานะ ดุดันแต่จริงใจ */
        .status-box {
            background-color: rgba(225, 29, 72, 0.1);
            color: #fda4af; /* สีแดงอ่อน */
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            border: 2px dashed #f43f5e;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="headerText">⚠️ SYSTEM OVERRIDE ⚠️</h2>
        <br>
        <button id="scanBtn" onclick="triggerAlert()">Decode Message</button>
        
        <div id="alertContainer">
