<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨กำลังใจจาก KITO MOS✨</title>
    <style>
        body {
            background-color: #f3e5f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(112, 48, 160, 0.15);
            text-align: center;
            max-width: 350px;
            width: 90%; 
            border: 3px solid #7030A0; 
            position: relative;
        }
        h2 {
            color: #7030A0;
            margin-top: 0;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(112, 48, 160, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(112, 48, 160, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(112, 48, 160, 0); }
        }

        button {
            background: linear-gradient(135deg, #9b59b6, #7030A0);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(112, 48, 160, 0.4);
            animation: pulse 2s infinite; 
        }
        button:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 8px 20px rgba(112, 48, 160, 0.6);
            animation: none; 
        }
        button:active {
            transform: scale(0.95);
        }
        
        #loadingContainer {
            display: none;
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        #loadingBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B, #9b59b6, #7030A0);
            border-radius: 10px;
            transition: width 2s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        #gifContainer {
            display: none; 
            margin-top: 20px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.3) rotate(-5deg); }
            50% { transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        #gifContainer img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #7030A0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .message {
            color: #7030A0;
            font-weight: bold;
            margin-top: 18px;
            font-size: 16px;
            line-height: 1.6;
        }
        .highlight {
            color: #FF3333; 
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>✨กำลังใจจาก KITO MOS✨</h2>
        <div class="subtitle" id="subtitleText">ตรวจพบคุณพยาบาลกำลังปั่นหนังสือสอบ! 📚</div>
        
        <button id="loveBtn" onclick="sendLove()">✨✨ รับไอเทมบัฟก่อนสอบ ✨✨</button>
        
        <div id="loadingContainer">
            <div id="loadingBar"></div>
        </div>

        <div id="gifContainer">
            <!-- มอส!! อย่าลืมไปโหลดไฟล์ GIF แพนด้าแดงมาใส่ในโฟลเดอร์เดียวกัน แล้วแก้ชื่อไฟล์ตรงนี้นะเว้ย! -->
            <img src="red_panda_cheer.gif" alt="Red Panda Cheer">
            <div class="message">
                ✨ เติมพลังให้คนเก่ง ✨<br>
                <span class="highlight">ขอให้อ่านตรงไหนก็เข้าหัว สอบกี่วิชาก็ All A ไปเลยนะ! ✌️✨</span><br>
                พักสายตาบ้างนะ สู้ๆ คับ! 🐼💕
            </div>
        </div>
    </div>

    <script>
        function sendLove() {
            // 1. ซ่อนปุ่ม และเปลี่ยนข้อความ Subtitle
            document.getElementById("loveBtn").style.display = "none";
            let subtitle = document.getElementById("subtitleText");
            // คงคอนเซปต์ส่งพลังข้ามจังหวัดไว้ แม่งเท่ดี!
            subtitle.innerHTML = "กำลังส่งไอเทมบัฟข้ามจังหวัด... ⏳<br>Please Wait...";
            subtitle.style.color = "#FF6B6B";
            subtitle.style.fontWeight = "bold";
            
            // 2. โชว์หลอดโหลดแบตเตอรี่
            let loadingContainer = document.getElementById("loadingContainer");
            let loadingBar = document.getElementById("loadingBar");
            loadingContainer.style.display = "block";
            
            // 3. สั่งให้หลอดวิ่งไปที่ 100%
            setTimeout(() => {
                loadingBar.style.width = "100%";
            }, 100);

            // 4. พอหลอดวิ่งเต็ม (รอประมาณ 2.2 วิ) ค่อยโชว์รูปและข้อความ
            setTimeout(() => {
                loadingContainer.style.display = "none";
                subtitle.style.display = "none";
                document.getElementById("gifContainer").style.display = "block";
            }, 2200); 
        }
    </script>

</body>
</html>
