<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>⚠️ System Alert ⚠️</title>
    <style>
        body {
            background-color: #1a1a1a; /* เปลี่ยนเป็นสีดำขลับให้ดูแพงและจริงจังขึ้น */
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* กันหน้าจอเลื่อนเวลาเด้ง animation */
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 75, 75, 0.6); 
            text-align: center;
            max-width: 320px;
            border: 4px solid #ff4b4b; 
        }
        h2 {
            color: #ff4b4b;
            margin-top: 0;
            font-size: 24px;
        }
        button {
            background-color: #ff4b4b; 
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(255, 75, 75, 0.5);
            animation: pulse 1.5s infinite; 
        }
        button:hover {
            transform: scale(1.1);
            background-color: #d50000;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #alertContainer {
            display: none; 
            margin-top: 15px;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        #alertContainer img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .message {
            color: #d50000;
            font-weight: bold;
            font-size: 22px;
            line-height: 1.4;
        }
        .sub-message {
            color: #333;
            font-size: 15px;
            margin-top: 10px;
            font-weight: bold;
        }
        /* เพิ่มกล่องสถานะ Official */
        .status-box {
            background-color: #ffebf0;
            color: #d50000;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            border: 2px dashed #ff9a9e;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="headerText">⚠️ สแกนสถานะหัวใจ ⚠️</h2>
        <br>
        <button id="scanBtn" onclick="triggerAlert()">กดเพื่อดูผลลัพธ์</button>
        
        <div id="alertContainer">
            <img src="red panda GIF by Digg.gif" alt="Cute Panda GIF">
            <div class="message">🚨 สถานะ: เลิกเนียนแล้ว! 🚨</div>
            <div class="sub-message">แจ้งให้คุณ "สติกเกอร์" ทราบ:<br>เด็กชายมอส คนนี้ เค้าไม่ได้มาเล่นๆ นะคับ!! ✨</div>
            <div class="status-box">
                ✔️ STATUS: Official Flirting<br>( 🤔💖 จีบอยู่นะรู้ยัง 🤔💖)
            </div>
        </div>
    </div>

    <script>
        function triggerAlert() {
            document.getElementById("alertContainer").style.display = "block";
            document.getElementById("scanBtn").style.display = "none";
            // เปลี่ยน Header ให้ดูแพงและยืนยันสถานะ
            document.querySelector("#headerText").innerText = "🛑 SYSTEM CONFIRMED 🛑";
        }
    </script>

</body>
</html>
