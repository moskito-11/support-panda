<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Support Box จากมอส</title>
    <style>
        body {
            background-color: #f0f7f4; /* สีเขียวมินต์พาสเทล */
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 300px;
        }
        button {
            background-color: #ff9a9e; /* สีชมพูหัวใจ */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        button:hover { transform: scale(1.1); }
        
        /* ซ่อนกล่องรูปภาพไว้ก่อนกดปุ่ม */
        #gifContainer {
            display: none; 
            margin-top: 15px;
        }
        #gifContainer img {
            width: 100%;
            border-radius: 15px;
        }
        .message {
            color: #ff9a9e;
            font-weight: bold;
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🐼 รับพลังงานด่วน 🐼</h2>
        <br>
        <button id="loveBtn" onclick="sendLove()">คลิกเติมพลัง</button>
        
        <div id="gifContainer">
            <img src="Screenshot 2026-05-26 180941.png" alt="Cute GIF">
            <div class="message">✨ วันนี้เหนื่อยมั้ยสู้ๆ น้าา มอสซัพพอร์ตอยู่ตรงนี้เสมอครับ! 💖</div>
        </div>
    </div>

    <script>
        function sendLove() {
            // สั่งให้โชว์รูป GIF
            document.getElementById("gifContainer").style.display = "block";
            // สั่งให้ซ่อนปุ่มทิ้งไปเลย ให้เหลือแต่ความน่ารัก
            document.getElementById("loveBtn").style.display = "none";
        }
    </script>

</body>
</html>
