<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>💙 System Support 💙</title>
    <style>
        body {
            background-color: #0f172a; /* เปลี่ยนเป็นสีน้ำเงินเข้ม อบอุ่น สงบ ไม่ดุดัน */
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(56, 189, 248, 0.4); /* เงาสีฟ้าละมุนๆ */
            text-align: center;
            max-width: 320px;
            border: 4px solid #38bdf8; /* ขอบสีฟ้าซัพพอร์ต */
        }
        h2 {
            color: #0284c7; /* สีฟ้าเข้ม */
            margin-top: 0;
            font-size: 24px;
        }
        button {
            background-color: #38bdf8; /* ปุ่มสีฟ้าสบายตา */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.5);
            animation: float 2s ease-in-out infinite; /* เปลี่ยนจาก pulse เตือนภัย เป็น float ลอยละมุนๆ */
        }
        button:hover {
            transform: translateY(-5px);
            background-color: #0284c7;
        }
        
        /* Animation ลอยขึ้นลงเบาๆ */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        #alertContainer {
            display: none; 
            margin-top: 15px;
            animation: fadeIn 0.8s ease-in-out; /* เปลี่ยนเด้งแรงๆ เป็นค่อยๆ สว่างขึ้นมาแบบอบอุ่น */
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        #alertContainer img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .message {
            color: #0284c7;
            font-weight: bold;
            font-size: 22px;
            line-height: 1.4;
        }
        .sub-message {
            color: #475569;
            font-size: 15px;
            margin-top: 10px;
            line-height: 1.5;
        }
        /* กล่องสถานะ ซัพพอร์ต */
        .status-box {
            background-color: #f0f9ff;
            color: #0369a1;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            border: 2px dashed #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="headerText">💌 ข้อความจากระบบ 💌</h2>
        <br>
        <button id="scanBtn" onclick="triggerAlert()">กดรับกำลังใจ</button>
        
        <div id="alertContainer">
            <img src="red panda GIF by Digg.gif" alt="Cute Panda GIF">
            <div class="message">✨ พลังงานบวกพร้อมส่ง! ✨</div>
            <div class="sub-message">ส่งถึงคุณ "สติกเกอร์":<br>✌️✌️ ขอให้ผ่านช่วงสอบไปได้ด้วยดีนะ ✌️✌️</div>
            
            <div class="status-box">
                ✔️ SYSTEM STATUS: Always Support<br>(เป็นกำลังใจให้อยู่ตรงนี้นะ ฝันดีคับคุณพยาบาล 🐼💙)
            </div>
        </div>
    </div>

    <script>
        function triggerAlert() {
            document.getElementById("alertContainer").style.display = "block";
            document.getElementById("scanBtn").style.display = "none";
            // เปลี่ยน Header ให้ดูอบอุ่น
            document.querySelector("#headerText").innerText = "💙 SYSTEM COMPLETED 💙";
        }
    </script>

</body>
</html>
