

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Box จากมอส</title>
    <style>
        body {
            background-color: #f0f7f4; /* สีเขียวมินต์พาสเทล */
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* กันหน้าจอเลื่อนตอนรูปเด้ง */
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 320px;
            border: 3px solid #ff9a9e; /* เพิ่มขอบสีชมพูให้ดูมีมิติ */
        }
        h2 {
            color: #ff9a9e;
            margin-top: 0;
            font-size: 24px;
        }
        button {
            background-color: #ff9a9e; /* สีชมพูหัวใจ */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4); /* เพิ่มเงาให้ปุ่มดูนูน */
        }
        button:hover {
            transform: scale(1.05) translateY(-3px); /* Hover แล้วปุ่มเด้งขึ้นนิดนึง */
            box-shadow: 0 6px 15px rgba(255, 154, 158, 0.6);
        }
        
        /* ซ่อนกล่องรูปภาพไว้ก่อนกดปุ่ม */
        #gifContainer {
            display: none; 
            margin-top: 15px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* อนิเมชันเด้งดึ๋ง */
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        #gifContainer img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #f0f7f4;
        }
        .message {
            color: #ff9a9e;
            font-weight: bold;
            margin-top: 15px;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🐼 รับพลังงานด่วน 🐼</h2>
        <br>
        <button id="loveBtn" onclick="sendLove()">คลิกเติมพลัง ⚡</button>
        
        <div id="gifContainer">
            <img src="panda.png" alt="Cute GIF">
            <div class="message">✨ วันนี้เหนื่อยมั้ยสู้ๆ น้าา<br>มอสซัพพอร์ตอยู่ตรงนี้เสมอครับ! 💖</div>
        </div>
    </div>

    <script>
        function sendLove() {
            // สั่งให้โชว์รูป GIF พร้อมอนิเมชันเด้ง
            document.getElementById("gifContainer").style.display = "block";
            // สั่งให้ซ่อนปุ่มทิ้งไปเลย
            document.getElementById("loveBtn").style.display = "none";
        }
    </script>

</body>
</html>
