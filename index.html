<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Capping Day 🤍</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            overflow: hidden; /* ป้องกันแถบเลื่อนจากหัวใจที่ลอย */
            background: linear-gradient(135deg, #f3e8ff 0%, #ffffff 100%);
        }

        /* อนิเมชันคลื่นหัวใจ (EKG) */
        .ekg-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawEkg 3s linear forwards, fadeOutEkg 1s 3s forwards;
            animation-iteration-count: infinite;
        }

        @keyframes drawEkg {
            0% { stroke-dashoffset: 1000; opacity: 1; }
            80% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }
        
        @keyframes fadeOutEkg {
            to { opacity: 0; }
        }

        /* อนิเมชันหัวใจเต้น */
        .heart-pulse {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* อนิเมชันหัวใจลอย */
        .floating-heart {
            position: absolute;
            bottom: -20px;
            font-size: 1.5rem;
            animation: floatUp 4s ease-in forwards;
            opacity: 0.7;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* สำหรับกล่องข้อความลับ */
        .reveal-anim {
            animation: slideUpFade 0.6s ease-out forwards;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-shadow {
            box-shadow: 0 20px 40px -10px rgba(168, 85, 247, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="relative z-10 w-[90%] max-w-md bg-white/80 backdrop-blur-sm rounded-3xl p-8 card-shadow text-center border border-purple-100">
        
        <!-- รูปแบบ EKG หัวใจ -->
        <div class="w-full flex justify-center mb-6">
            <svg class="w-full h-24" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- เส้นคลื่นหัวใจ -->
                <path class="ekg-path" d="M 0 30 L 40 30 L 50 10 L 60 50 L 70 20 L 80 40 L 90 30 L 140 30 L 150 15 L 160 45 L 170 30 L 200 30" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- หัวใจตรงกลาง -->
                <path class="heart-pulse" d="M100 20 C100 20 90 10 80 20 C70 30 100 50 100 50 C100 50 130 30 120 20 C110 10 100 20 100 20 Z" fill="#c084fc" opacity="0.8"/>
            </svg>
        </div>

        <!-- ข้อความหลัก -->
        <h1 class="text-2xl sm:text-3xl font-bold text-purple-800 mb-3 tracking-tight">
            Happy Capping Day! 🤍
        </h1>
        <p class="text-purple-600 font-medium mb-8 text-sm sm:text-base leading-relaxed">
            ยินดีด้วยกับหมวกพยาบาลใบแรกนะหมูอ้วน<br>เก่งมากๆ เลยรู้มั้ย!
        </p>

        <!-- ปุ่มกด -->
        <button id="giftBtn" class="w-full bg-gradient-to-r from-purple-500 to-purple-400 hover:from-purple-600 hover:to-purple-500 text-white font-semibold py-3 px-6 rounded-full shadow-lg transform transition-all duration-300 hover:scale-105 active:scale-95 focus:outline-none ring-4 ring-purple-100">
            ✨ คลิกรับของขวัญจากคนไกล ✨
        </button>

        <!-- กล่องข้อความลับ (ซ่อนไว้ตอนแรก) -->
        <div id="secretMsg" class="hidden mt-6 bg-purple-50 rounded-2xl p-5 border border-purple-200 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-300 via-purple-500 to-purple-300"></div>
            <p class="text-purple-800 font-semibold text-base sm:text-lg leading-relaxed">
                "เก่งมากๆ เลยนะ! 🤍<br>
                เดือนหน้ากัปตันไปหาแน่นอน<br>
                เตรียมตัวรอให้พาไปเลี้ยงฉลอง<br>
                ที่โคราชได้เลย!"
            </p>
        </div>
    </div>

    <!-- Script สำหรับการทำงานของปุ่มและหัวใจลอย -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('giftBtn');
            const msg = document.getElementById('secretMsg');

            // เมื่อกดปุ่ม
            btn.addEventListener('click', () => {
                // ซ่อนปุ่ม
                btn.style.display = 'none';
                
                // แสดงข้อความลับพร้อมอนิเมชัน
                msg.classList.remove('hidden');
                msg.classList.add('reveal-anim');

                // เร่งการสร้างหัวใจให้เยอะขึ้นชั่วคราวเพื่อฉลอง
                createBurstOfHearts();
            });

            // ฟังก์ชันสร้างหัวใจลอย
            function createHeart() {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                
                // สุ่มอีโมจิหัวใจสีต่างๆ โทนม่วง/ขาว
                const hearts = ['💜', '🤍', '✨', '🩺'];
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                
                // สุ่มตำแหน่งซ้ายขวา
                heart.style.left = Math.random() * 100 + 'vw';
                
                // สุ่มระยะเวลาลอย
                const animationDuration = Math.random() * 2 + 3; // 3-5 วินาที
                heart.style.animationDuration = animationDuration + 's';
                
                document.body.appendChild(heart);

                // ลบ DOM เมื่อลอยเสร็จเพื่อไม่ให้หนักเครื่อง
                setTimeout(() => {
                    heart.remove();
                }, animationDuration * 1000);
            }

            // สร้างหัวใจทีละดวงทุกๆ 800ms
            let heartInterval = setInterval(createHeart, 800);

            // ฟังก์ชันฉลองตอนกดปุ่ม (ปล่อยหัวใจรัวๆ)
            function createBurstOfHearts() {
                clearInterval(heartInterval);
                for(let i=0; i<15; i++) {
                    setTimeout(createHeart, i * 100);
                }
                // กลับมาสร้างปกติ
                setTimeout(() => {
                    heartInterval = setInterval(createHeart, 800);
                }, 2000);
            }
        });
    </script>
</body>
</html>
