<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨กำลังใจจาก KITO MOS✨</title>
    <style>
        /* ตั้งค่าพื้นหลังและฟอนต์ */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(-45deg, #f3e5f5, #e1bee7, #fce4ec, #ede7f6);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ฟองอากาศลอยดุ๊กดิ๊กด้านหลัง */
        .bubbles {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .bubbles li {
            position: absolute; display: block; list-style: none; animation: floatUp 12s linear infinite; bottom: -150px; border-radius: 50%; background: rgba(255, 255, 255, 0.4);
        }
        .bubbles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .bubbles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 1s; animation-duration: 6s; }
        .bubbles li:nth-child(3) { left: 70%; width: 40px; height: 40px; animation-delay: 2s; }
        .bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 8s; }
        
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(360deg); opacity: 0; }
        }

        /* กล่องข้อความหลัก */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(112, 48, 160, 0.2);
            text-align: center;
            max-width: 350px;
            width: 90%;
            border: 3px solid rgba(112, 48, 160, 0.8);
            position: relative;
            z-index: 10;
        }

        h2 { color: #7030A0; margin-top: 0; font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .subtitle { color: #666; font-size: 15px; margin-bottom: 25px; font-weight: 500; }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 107, 107, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }

        /* ปุ่มกดรับกำลังใจ */
        button {
            background: linear-gradient(135deg, #FF6B6B, #9b59b6);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
            animation: pulse 2s infinite;
        }
        button:hover { transform: scale(1.08) translateY(-3px); animation: none; }
        button:active { transform: scale(0.95); }

        /* คอนเทนเนอร์ข้อความหลังกดปุ่ม */
        #messageContainer { display: none; margin-top: 20px; animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.3); } 50% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
        
        .message { color: #7030A0; font-weight: bold; font-size: 17px; line-height: 1.6; }
        .highlight { color: #FF3333; font-size: 20px; }

        /* ตั้งค่าระบบพลุหัวใจ (Particle System) */
        #heart-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; overflow: hidden;
        }
        .heart {
            position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); font-size: 2rem; opacity: 1;
        }
    </style>
</head>
<body>

    <ul class="bubbles">
        <li></li><li></li><li></li><li></li>
    </ul>

    <!-- คอนเทนเนอร์สำหรับระเบิดหัวใจ -->
    <div id="heart-container"></div>

    <div class="card">
        <h2>✨กำลังใจจาก KITO MOS✨</h2>
        <div class="subtitle" id="subtitleText">ตรวจพบ : คุณพยาบาลทำงานเหนื่อยมาก! 🥺💖</div>
        
        <button id="loveBtn" onclick="explodeHearts()">✨ กดรับกำลังใจจากมอสกีโต้ ✨</button>

        <div id="messageContainer">
            <div class="message">
                <span class="highlight">ปิ้ววววววววว! ❤️💖💕✨</span><br><br>
                ขอให้หายเหนื่อยน้าาาา<br>
                เก่งมากแล้วน้าาคนเก่งที่ผ่านวันนี้มาได้!<br><br>
                 เดี๋ยวจะอยู่เป็นเพื่อนแกเองคืนนี้💆‍♀️🫶
            </div>
        </div>
    </div>

    <script>
        function explodeHearts() {
            // ซ่อนปุ่มและข้อความเดิม เปิดข้อความใหม่
            document.getElementById("loveBtn").style.display = "none";
            document.getElementById("subtitleText").style.display = "none";
            document.getElementById("messageContainer").style.display = "block";

            const container = document.getElementById("heart-container");
            const emojis = ["❤️", "💖", "💕", "✨", "🫶", "🥰"];
            const totalHearts = 200; // จำนวนหัวใจที่ต้องการให้พุ่งออกมา

            // ฟังก์ชันเสกหัวใจทีละดวง
            for (let i = 0; i < totalHearts; i++) {
                setTimeout(() => {
                    const heart = document.createElement("div");
                    heart.classList.add("heart");
                    heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    
                    // สุ่มขนาดให้ดูมีมิติ
                    heart.style.fontSize = (Math.random() * 30 + 15) + "px";
                    
                    // สุ่มระยะการกระจายซ้าย-ขวา
                    const spreadX = (Math.random() - 0.5) * window.innerWidth;
                    // สุ่มความสูงที่หัวใจจะลอยไปถึง
                    const flyHeight = -(Math.random() * window.innerHeight + 100);
                    // สุ่มระยะเวลาลอย
                    const duration = Math.random() * 2000 + 1500;

                    // สร้าง Animation ด้วย JavaScript Web Animations API
                    heart.animate([
                        { transform: `translate(-50%, 0px) scale(0.5)`, opacity: 1 },
                        { transform: `translate(calc(-50% + ${spreadX/2}px), ${flyHeight/2}px) scale(1.2)`, opacity: 1 },
                        { transform: `translate(calc(-50% + ${spreadX}px), ${flyHeight}px) scale(0.8)`, opacity: 0 }
                    ], {
                        duration: duration,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                        fill: 'forwards'
                    });

                    container.appendChild(heart);
                    
                    // เคลียร์ DOM เมื่อ Animation จบเพื่อไม่ให้เครื่องค้าง
                    setTimeout(() => {
                        heart.remove();
                    }, duration);

                }, i * 15); // ดีเลย์การเกิดทีละ 15 milliseconds ให้ดูพุ่งเป็นสายน้ำ
            }
        }
    </script>
</body>
</html>
